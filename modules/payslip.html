<div class="payslip-container">
  <div class="module-header">
    <h1><i class="fas fa-file-invoice"></i> Payslip</h1>
  </div>

  <div id="payslipContainer">
    <p>Select a payslip from the Payroll table to view details here. Use the payroll module to generate payslips first.</p>
  </div>

  <div id="payslipView" style="display:none; margin-top:12px;">
    <div class="payslip-card">
      <h2 id="psName">Name</h2>
      <p><strong>Staff Number:</strong> <span id="psStaff"></span></p>
      <p><strong>Designation:</strong> <span id="psDesignation"></span></p>
      <p><strong>Basic Salary:</strong> GH₵ <span id="psBasic"></span></p>
      <p><strong>Employee PF:</strong> GH₵ <span id="psEmployeePF"></span></p>
      <p><strong>PF (10%):</strong> GH₵ <span id="psPF10"></span></p>
      <p><strong>Tax Reliefs:</strong> GH₵ <span id="psRelief"></span></p>
      <p><strong>Taxable Income:</strong> GH₵ <span id="psTaxable"></span></p>
      <p><strong>PAYE:</strong> GH₵ <span id="psPAYE"></span></p>
      <p><strong>Total Deduction:</strong> GH₵ <span id="psTotalDeduction"></span></p>
      <p><strong>Net Pay:</strong> GH₵ <span id="psNetPay"></span></p>

      <div style="margin-top:12px;">
        <button class="primary-btn" onclick="printPayslip()">Print Payslip</button>
        <button onclick="closePayslipView()">Close</button>
      </div>
    </div>
  </div>
</div>
