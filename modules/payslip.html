<!-- modules/payslip.html -->
<div class="payslips-page">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
    <div style="font-size:20px; font-weight:800; letter-spacing:1px;">Payslips</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <label for="payslipPeriod" style="font-weight:700; color:#333;">Period</label>
      <input id="payslipPeriod" type="month" style="padding:6px 8px; border-radius:6px; border:1px solid #ccc;">
      <button id="sendAllPayslipsBtn" class="btn-primary" style="padding:8px 12px; font-weight:700;">Send</button>
    </div>
  </div>

  <div style="overflow:auto;">
    <table id="payslipListTable" class="payroll-table" style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th style="width:20%;">Staff Number</th>
          <th style="width:60%;">Full Name</th>
          <th style="width:20%; text-align:right;">Payslip</th>
        </tr>
      </thead>
      <tbody id="payslipListBody">
        <tr><td colspan="3" style="padding:14px; text-align:center; color:#666;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Action portal (positioned) -->
  <div id="payslipActionPortal" style="display:none; position:fixed; z-index:2000;"></div>
</div>

<!-- Hidden payslip modal (use your detailed payslip structure here) -->
<div id="payslipModal" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:3000; background:rgba(0,0,0,0.5);">
  <div id="payslipModalContent" style="max-width:920px; width:100%; margin:20px; background:white; border-radius:8px; overflow:auto;">
    <!-- Insert the full payslip markup you gave (trimmed) -->
    <!-- For brevity we include the head of your template and a few placeholders; the script will populate fields -->
    <div class="payslip-container" style="padding:24px;">
      <div class="header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #000; padding-bottom:12px;">
        <div class="header-left">
          <div class="logo-placeholder" id="modalLogo">LOGO</div>
        </div>
        <div class="header-center">
          <div class="payslip-title">PAYSLIP</div>
        </div>
        <div class="header-right">
          <div class="pay-period-label">Pay Period</div>
          <div class="pay-period-value" id="modalPayPeriod">--</div>
        </div>
      </div>

      <div class="employee-details" style="margin-top:18px;">
        <div class="detail-item"><span class="label">Employee ID:</span> <span class="value" id="modalEmpId">-</span></div>
        <div class="detail-item"><span class="label">SSNIT No.:</span> <span class="value" id="modalSSNIT">-</span></div>
        <div class="detail-item"><span class="label">Name:</span> <span class="value" id="modalName">-</span></div>
        <div class="detail-item"><span class="label">GH Card No.:</span> <span class="value" id="modalGhanaCard">-</span></div>
        <div class="detail-item"><span class="label">Department:</span> <span class="value" id="modalDept">-</span></div>
        <div class="detail-item"><span class="label">Email:</span> <span class="value" id="modalEmail">-</span></div>
        <div class="detail-item"><span class="label">Designation:</span> <span class="value" id="modalDesignation">-</span></div>
        <div class="detail-item"><span class="label">Bank:</span> <span class="value" id="modalBank">-</span></div>
      </div>

      <!-- simplified payroll table area inside modal -->
      <div id="modalPayrollTableArea" style="margin-top:18px;">
        <!-- script populates contents (you can reuse the static payslip template here) -->
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; padding:12px 0;">
        <button id="modalSendBtn" class="btn-primary" style="padding:8px 12px;">Send</button>
        <button id="modalCloseBtn" class="btn-secondary" style="padding:8px 12px;">Close</button>
      </div>
    </div>
  </div>
</div>
