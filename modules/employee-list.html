<div class="employee-list-container">
  <div class="module-header">
    <h1><i class="fas fa-users"></i> Employee List</h1>
  </div>

  <div class="employee-controls">
    <button class="primary-btn" onclick="showAddEmployeeModal()"><i class="fas fa-plus"></i> Add Employee</button>
    <input type="search" id="employeeSearch" placeholder="Search employees..." oninput="filterEmployeeList()">
  </div>

  <div id="employeeListContainer">
    <table class="data-table" id="employeeTable">
      <thead>
        <tr>
          <th>STAFF NUMBER</th>
          <th>NAME OF EMPLOYEE</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Email</th>
          <th>SSNIT NO.</th>
          <th>Ghana card ID NO.</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
        <!-- Rows injected by JS -->
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Employee Modal -->
  <div id="employeeModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2 id="employeeModalTitle">Add Employee</h2>
      <form id="employeeForm" onsubmit="event.preventDefault(); saveEmployee();">
        <div class="form-row-two">
          <div class="form-group">
            <label for="empStaffNumber">STAFF NUMBER</label>
            <input id="empStaffNumber" type="text" required>
          </div>
          <div class="form-group">
            <label for="empName">NAME OF EMPLOYEE</label>
            <input id="empName" type="text" required>
          </div>
        </div>

        <div class="form-row-two">
          <div class="form-group">
            <label for="empDepartment">Department</label>
            <input id="empDepartment" type="text">
          </div>
          <div class="form-group">
            <label for="empDesignation">Designation</label>
            <input id="empDesignation" type="text">
          </div>
        </div>

        <div class="form-row-two">
          <div class="form-group">
            <label for="empEmail">Email</label>
            <input id="empEmail" type="email">
          </div>
          <div class="form-group">
            <label for="empSSNIT">SSNIT NO.</label>
            <input id="empSSNIT" type="text">
          </div>
        </div>

        <div class="form-row-single">
          <div class="form-group">
            <label for="empGhanaCard">Ghana card ID NO.</label>
            <input id="empGhanaCard" type="text">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary-btn">Save</button>
          <button type="button" onclick="closeEmployeeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
