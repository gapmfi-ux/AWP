<div class="employee-list-container">
  <!-- Header -->
  <div class="employee-list-header">
    <h2><i class="fas fa-users"></i> Employee List</h2>
    <div class="employee-controls">
      <input type="text" id="employeeSearch" placeholder="Search employees..." oninput="filterEmployeeList()">
      <button class="btn-primary" onclick="showAddEmployeeModal()">
        <i class="fas fa-plus"></i> Add Employee
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="employee-table-wrapper">
    <table class="employee-table">
      <thead>
        <tr>
          <th>Staff #</th>
          <th>Name</th>
          <th>Department</th>
          <th>Designation</th>
          <th>Email</th>
          <th>Ssnit</th>
          <th style="text-align:center;">Action</th>
        </tr>
      </thead>
      <tbody id="employeeTableBody">
        <tr>
          <td colspan="7" class="employee-table-empty">
            <i class="fas fa-users"></i>
            <p>No employees found</p>
            <span class="sub-text">Click "Add Employee" to get started</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Employee Modal -->
<div class="payroll-modal" id="employeeModal">
  <div class="payroll-modal-content">
    <!-- Header -->
    <div class="payroll-modal-header">
      <h3><i class="fas fa-user-plus"></i> <span id="employeeModalTitle">Add Employee</span></h3>
      <button class="payroll-modal-close" onclick="closeEmployeeModal()">&times;</button>
    </div>
    
    <!-- Body -->
    <div class="payroll-modal-body">
      <div class="form-hint">
        <i class="fas fa-info-circle"></i> Enter employee details. Staff number must be unique.
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Staff Number <span class="required">*</span></label>
          <input type="text" id="empStaffNumber" placeholder="e.g. STAFF001">
        </div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" id="empName" placeholder="Employee full name">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <input type="text" id="empDepartment" placeholder="e.g. Finance">
        </div>
        <div class="form-group">
          <label>Designation</label>
          <input type="text" id="empDesignation" placeholder="e.g. Accountant">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="empEmail" placeholder="employee@company.com">
        </div>
        <div class="form-group">
          <label>Ssnit Number</label>
          <input type="text" id="empSSNIT" placeholder="SSNIT number">
        </div>
      </div>
      
      <div class="form-group">
        <label>Ghana Card Number</label>
        <input type="text" id="empGhanaCard" placeholder="Ghana Card number">
      </div>
    </div>
    
    <!-- Footer -->
    <div class="payroll-modal-footer">
      <button class="btn-secondary" onclick="closeEmployeeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEmployee()">
        <i class="fas fa-save"></i> Save Employee
      </button>
    </div>
  </div>
</div>
