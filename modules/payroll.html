<!-- Payroll Module -->
<div class="payroll-container">
  <div class="payroll-header">
    <h2><i class="fas fa-calculator"></i> Payroll Management</h2>
  </div>

  <!-- Controls Row -->
  <div class="payroll-controls-row">
    <div class="payroll-controls-left">
      <button class="btn-primary" onclick="processPayroll()">
        <i class="fas fa-play"></i> Run Payroll
      </button>
      <button class="btn-secondary" onclick="loadPayrollPeriod()">
        <i class="fas fa-sync"></i> Load Period
      </button>
      <button class="btn-outline" onclick="printPayroll()">
        <i class="fas fa-print"></i> Print
      </button>
    </div>
    <div class="payroll-controls-right">
      <label for="payPeriodSelect">Pay Period:</label>
      <input type="month" id="payPeriodSelect" onchange="loadPayrollPeriod()">
      <button class="btn-secondary" onclick="deletePayrollPeriod()" style="background:#fee2e2; color:#dc2626;">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="payroll-table-wrapper">
    <table class="payroll-table" id="payrollTable">
      <thead>
        <tr>
          <th style="min-width:70px;">Staff #</th>
          <th style="min-width:120px;">Name</th>
          <th style="min-width:100px;">Designation</th>
          <th style="min-width:90px; text-align:right;">Basic Salary</th>
          <th style="min-width:90px; text-align:right;">Allowances</th>
          <th style="min-width:90px; text-align:right;">Gross Salary</th>
          <th style="min-width:90px; text-align:right;">Emp Pension (5.5%)</th>
          <th style="min-width:90px; text-align:right;">Emp PF (10%)</th>
          <th style="min-width:80px; text-align:right;">Tax Relief</th>
          <th style="min-width:90px; text-align:right;">Taxable Income</th>
          <th style="min-width:80px; text-align:right;">PAYE</th>
          <th style="min-width:90px; text-align:right;">Total Deduction</th>
          <th style="min-width:90px; text-align:right;">Net Pay</th>
          <th style="min-width:90px; text-align:right;">Emp Pension (13%)</th>
          <th style="min-width:90px; text-align:right;">Emp PF (5%)</th>
          <th style="min-width:80px; text-align:right;">Monthly Loan</th>
        </tr>
      </thead>
      <tbody id="payrollTableBody">
        <tr>
          <td colspan="16" class="payroll-table-empty">
            <i class="fas fa-money-check-alt"></i>
            <p>No payroll data</p>
            <span class="sub-text">Select a pay period or run payroll</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
